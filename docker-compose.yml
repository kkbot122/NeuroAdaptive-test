services:
  db:
    image: postgres:16
    container_name: neuro_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neuro_db
    ports:
      # Host-side 5433: this machine already runs a native PostgreSQL on 5432.
      # Containers still reach this database at db:5432 over the compose
      # network, so only external tools (psql, a GUI) use the mapped port.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: neuro_qdrant
    restart: always
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuro_backend
    command: sh wait-for-db.sh
    ports:
      - "8000:8000"
    # Notice: We removed the hardcoded DATABASE_URL and INTERNAL_API_KEY
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      # Uploaded originals live on the backend's local disk this sprint rather
      # than object storage; served only through an authenticated,
      # owner-checked endpoint. See SPRINT_LOG.md for the substitution.
      - uploaded_documents:/app/var/uploads
    depends_on:
      - db
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuro_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      # It is okay to leave non-secret configuration variables here
      - INTERNAL_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploaded_documents: